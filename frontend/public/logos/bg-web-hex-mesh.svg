<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Hexagonal Carbon Pattern -->
    <pattern id="hexTile" width="40" height="69.28" patternUnits="userSpaceOnUse">
      <!-- Background fill -->
      <rect width="40" height="69.28" fill="#060911" />
      <!-- Hexagon vector lines -->
      <path d="M 20,0 L 40,11.55 L 40,34.64 L 20,46.19 L 0,34.64 L 0,11.55 Z 
               M 20,69.28 L 40,57.73 L 40,34.64 L 20,46.19 L 0,34.64 L 0,57.73 Z" 
            fill="none" stroke="#131d2e" stroke-width="0.9" opacity="0.7" />
      <!-- Nano-web filament connecting nodes -->
      <path d="M 20,23.09 L 20,46.19 M 0,34.64 L 40,34.64" 
            fill="none" stroke="#ef4444" stroke-width="0.6" opacity="0.3" />
      <!-- Micro-node at vertex -->
      <circle cx="20" cy="23.09" r="1" fill="#38bdf8" opacity="0.4" />
      <circle cx="20" cy="46.19" r="1" fill="#38bdf8" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="240" height="240" fill="url(#hexTile)" />
</svg>