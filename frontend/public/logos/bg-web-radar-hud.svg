<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs><clipPath id="canvasClip"><rect width="1920" height="1080" /></clipPath>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0a0f1e" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <filter id="radarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgDark)" />
<g clip-path="url(#canvasClip)">

  <!-- Tactical Range Rings (Isometric Web Grid) -->
  <g transform="translate(960, 540)">
    <!-- Radar Range Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.4" />
    <circle cx="0" cy="0" r="300" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.45" />
    <circle cx="0" cy="0" r="460" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="6,6" opacity="0.35" />
    <circle cx="0" cy="0" r="640" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.3" />
    <circle cx="0" cy="0" r="840" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="8,8" opacity="0.2" />

    <!-- Spider-Sense Warning Waves (Arcing Radiants) -->
    <g stroke="#ff334b" stroke-width="2" fill="none" opacity="0.7">
      <path d="M -350,-240 A 420 420 0 0 0 -420,0" stroke-dasharray="10,6" />
      <path d="M -440,-290 A 520 520 0 0 0 -520,0" stroke-width="2.5" />
      <path d="M 350,-240 A 420 420 0 0 1 420,0" stroke-dasharray="10,6" />
      <path d="M 440,-290 A 520 520 0 0 1 520,0" stroke-width="2.5" />
    </g>

    <!-- Radar Sweep Sector -->
    <path d="M 0,0 L 460,-330 A 580 580 0 0 1 580,0 Z" fill="url(#radarSweep)" />

    <!-- Radar Crosshairs with Coordinate Degree Markers -->
    <line x1="-920" y1="0" x2="920" y2="0" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />
    <line x1="0" y1="-500" x2="0" y2="500" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,4" opacity="0.4" />

    <!-- 45-degree angle rays -->
    <line x1="-650" y1="-375" x2="650" y2="375" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.3" />
    <line x1="-650" y1="375" x2="650" y2="-375" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.3" />

    <!-- Spider Web Hexagonal Polygons -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#ef4444" stroke-width="1.2" opacity="0.35" />
    <polygon points="0,-300 260,-150 260,150 0,300 -260,150 -260,-150" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="6,6" opacity="0.25" />
    <polygon points="0,-460 398,-230 398,230 0,460 -398,230 -398,-230" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.2" />

    <!-- Incident Targets on Radar Grid -->
    <circle cx="280" cy="-140" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="280" cy="-140" r="4" fill="#ef4444" filter="url(#radarGlow)" />

    <circle cx="-220" cy="180" r="9" fill="none" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="-220" cy="180" r="3.5" fill="#f59e0b" />

    <circle cx="340" cy="220" r="8" fill="none" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="340" cy="220" r="3" fill="#00f2fe" filter="url(#radarGlow)" />
  </g>
</g></svg>