<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Dark Stark OS Base -->
    <linearGradient id="bgBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Radial Vignette so center is subtle and edges dark -->
    <radialGradient id="redAtmosphere" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#ef4444" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="cyanAtmosphere" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Node Filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1" fill="#334155" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1920" height="1080" fill="url(#bgBase)" />
  <rect width="1920" height="1080" fill="url(#dotGrid)" />
  <rect width="1920" height="1080" fill="url(#redAtmosphere)" />
  <rect width="1920" height="1080" fill="url(#cyanAtmosphere)" />

  <!-- SPIDER WEB DISPATCH MATRIX (Subtle opacity to keep UI legible) -->
